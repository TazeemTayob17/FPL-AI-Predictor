# Re-verify against the official FPL rules each season - transfer caps and chip structure change.
season:
  label: "2026-27"
  current_gameweek_at_setup: null   # null = pre-season / cold-start

team:
  # fpl_team_id lives in .env (FPL_TEAM_ID), not here
  mini_league_ids: [121412]

rules:
  budget_million: 100.0
  squad_size: 15
  squad_composition:
    GKP: 2
    DEF: 5
    MID: 5
    FWD: 3
  starting_xi_size: 11
  formation_min:
    GKP: 1
    DEF: 3
    MID: 2
    FWD: 1
  max_players_per_club: 3
  free_transfers_per_week: 1
  free_transfers_max_banked: 5
  points_hit_per_extra_transfer: -4
  captain_multiplier: 2
  triple_captain_multiplier: 3

chips:
  # Unused first-half chips are forfeited at this deadline, not carried over
  first_half_deadline_gw: 19
  first_half_deadline_utc: "2027-01-02T13:30:00Z"
  chips_per_gameweek_limit: 1

model:
  # Backtested 2026-08-15 across 2023-24/2024-25/2025-26 (GW1-10, walk-forward): the trained model beat cold-start
  # priors at every single gameweek tested, including GW1 itself (rank-corr ~0.6-0.76 vs ~0.33-0.42) - both for
  # players with prior-season history and, once cold_start.py's promoted-club fallback was actually wired up
  # (see models/cold_start.py's default_weak_team_prior), for debut/promoted-club players too. 0 means cold-start
  # only fires as the registry-missing safety fallback, not on a GW-elapsed schedule. See IMPLEMENTATION_PLAN.md
  # "Deviations" section for the full investigation and the one caveat (model freshness) worth knowing about.
  cold_start_gw_threshold: 0   # GWs of current-season data needed before switching off cold-start priors
  near_term_horizon_gws: 5
  season_planner_refresh: "after_each_gameweek"

strategy:
  differential_aggressiveness: "balanced"   # template | balanced | differential

refresh:
  scheduled_times_daily: ["08:00", "13:00", "20:00"]
  deadline_window_hours: 24
  deadline_window_frequency_minutes: 60
