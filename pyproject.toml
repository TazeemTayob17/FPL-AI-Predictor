[project]
name = "fpl-agent"
version = "0.1.0"
description = "Personal FPL AI predictor: squad selection, weekly transfers, captaincy, and chip timing."
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "lightgbm>=4.5",
    "ortools>=9.11",
    "streamlit>=1.38",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
